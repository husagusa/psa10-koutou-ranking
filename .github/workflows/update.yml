name: Update PSA10 Rankings

on:
  workflow_dispatch:
  schedule:
    - cron: "10 22 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Collect
        run: python collector.py

      - name: Publish data for GitHub Pages
        run: cp data/history.csv docs/history.csv

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.csv docs/history.csv
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update PSA10 prices"
            git push
          fi
