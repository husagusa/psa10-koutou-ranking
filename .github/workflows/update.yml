name: Update PSA10 Rankings

on:
  workflow_dispatch:
  schedule:
    - cron: "10 22 * * *"
  issues:
    types: [opened, edited, reopened]
  push:
    branches: [main]
    paths: ['docs/**', 'cards.csv', 'scripts/**', '.github/workflows/update.yml']

permissions:
  contents: read

# Daily updates and card additions share one writer. Every run scans all pending
# requests so a replaced pending run never loses a card request.
concurrency:
  group: psa10-data-and-pages
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name != 'issues' ||
      ((startsWith(github.event.issue.title, '[カード追加]') || startsWith(github.event.issue.title, '[所持枚数]')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test portfolio calculations
        run: node --test tests/test_portfolio.cjs
      - name: Test request validation
        run: python -m unittest discover -s tests -v
      - name: Validate and register pending card requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/card_requests.py prepare
      - name: Install
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Collect
        id: collect
        continue-on-error: true
        run: python collector.py
      - name: Publish data for GitHub Pages
        run: |
          cp data/history.csv docs/history.csv
          cp cards.csv docs/cards.csv
      - name: Commit cards and prices
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards.csv data/history.csv docs/history.csv docs/cards.csv data/holding_requests.json
          if ! git diff --cached --quiet; then
            git commit -m "Update PSA10 cards and prices"
            gh auth setup-git
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Report request results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: python scripts/card_requests.py report
      - name: Surface collection failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Collection failed; registered cards and existing history were preserved. See Collect logs.'
          exit 1
