<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PSA10 高騰ランキング</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;margin:0;background:#f6f7f9;color:#111}
.wrap{max-width:980px;margin:auto;padding:16px 14px 40px}
h1{font-size:27px;margin:8px 0 4px}
.sub{font-size:13px;color:#666;margin-bottom:16px}
.controls{display:flex;gap:10px;margin:12px 0 16px}
select{font-size:16px;padding:10px 12px;border:1px solid #ccc;border-radius:12px;background:white}
.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.rank{font-weight:800;font-size:18px}
.name{font-weight:700;margin:5px 0 10px;line-height:1.35}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.label{font-size:12px;color:#666}
.value{font-size:17px;font-weight:750}
.pos{color:#087a35}.neg{color:#b42318}
a{color:inherit;text-decoration:none}
.note{font-size:12px;color:#777;margin-top:18px;line-height:1.6}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
<h1>🔥 PSA10 高騰ランキング</h1>
<div class="sub" id="status">データを読み込み中...</div>
<div class="controls">
<select id="period"><option value="1">前日</option><option value="7">7日</option><option value="30">30日</option></select>
<select id="metric"><option value="diff">上昇額</option><option value="pct">上昇率</option></select>
</div>
<div id="list"></div>
<div class="note">7日/30日前ちょうどの相場がない場合、その日以前でもっとも近い日付を比較元にします。</div>
</div>
<script>
let cards = [];

function csvParse(text){
  const lines=text.trim().split(/\r?\n/);
  if(lines.length<2) return [];
  const headers=lines[0].replace(/^\uFEFF/,'').split(',');
  return lines.slice(1).map(line=>{
    const vals=[]; let cur=''; let q=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c=='"'){
        if(q && line[i+1]=='"'){cur+='"';i++} else q=!q;
      } else if(c==',' && !q){vals.push(cur);cur=''} else cur+=c;
    }
    vals.push(cur);
    const o={}; headers.forEach((h,i)=>o[h]=vals[i]??''); return o;
  });
}
function yen(n,signed=false){ if(n==null) return '-'; return `${signed&&n>0?'+':''}¥${Math.trunc(n).toLocaleString('ja-JP')}` }
function pct(n){ if(n==null) return '-'; return `${n>0?'+':''}${(n*100).toFixed(2)}%` }
function cls(n){ return n>0?'pos':n<0?'neg':'' }

function build(rows){
  const map=new Map();
  for(const r of rows){
    const key=r.url;
    if(!map.has(key)) map.set(key,{url:r.url,name:r.name,rows:[]});
    map.get(key).rows.push({date:r.source_date,price:Number(r.price)});
  }
  cards=[...map.values()];
  cards.forEach(c=>c.rows.sort((a,b)=>a.date.localeCompare(b.date)));
}
function compare(rows,days){
  const cur=rows[rows.length-1];
  const td=new Date(cur.date+'T00:00:00');
  td.setDate(td.getDate()-days);
  const target=td.toISOString().slice(0,10);
  let old=rows.find(r=>r.date===target);
  if(!old){
    const past=rows.filter(r=>r.date<=target);
    old=past.length?past[past.length-1]:null;
  }
  if(!old) return null;
  const diff=cur.price-old.price;
  return {old:old.price,base:old.date,diff:diff,pct:old.price?diff/old.price:null};
}
function render(){
  const days=Number(document.getElementById('period').value);
  const metric=document.getElementById('metric').value;
  const view=cards.map(c=>{
    const cur=c.rows[c.rows.length-1];
    return {...c,cur,cmp:compare(c.rows,days)};
  }).sort((a,b)=>{
    const av=a.cmp?.[metric], bv=b.cmp?.[metric];
    if(av==null&&bv==null)return 0;if(av==null)return 1;if(bv==null)return -1;
    return bv-av;
  });
  document.getElementById('list').innerHTML=view.map((r,i)=>`
    <div class="card">
      <div class="rank">${i+1}位</div>
      <div class="name"><a href="${r.url}" target="_blank">${r.name}</a></div>
      <div class="grid">
        <div><div class="label">現在相場</div><div class="value">${yen(r.cur.price)}</div><div class="label">${r.cur.date}</div></div>
        <div><div class="label">比較元相場</div><div class="value">${r.cmp?yen(r.cmp.old):'-'}</div><div class="label">${r.cmp?r.cmp.base:'-'}</div></div>
        <div><div class="label">上昇額</div><div class="value ${r.cmp?cls(r.cmp.diff):''}">${r.cmp?yen(r.cmp.diff,true):'-'}</div></div>
        <div><div class="label">上昇率</div><div class="value ${r.cmp?cls(r.cmp.pct):''}">${r.cmp?pct(r.cmp.pct):'-'}</div></div>
      </div>
    </div>`).join('');
}
fetch('history.csv?ts='+Date.now()).then(r=>{
  if(!r.ok) throw new Error('history.csv がまだありません');
  return r.text();
}).then(t=>{
  const rows=csvParse(t); build(rows);
  document.getElementById('status').textContent=`対象 ${cards.length}枚｜最新データを表示中`;
  render();
}).catch(e=>{
  document.getElementById('status').textContent='初回データ取得前です。GitHub Actionsを1回実行してください。';
});
document.getElementById('period').addEventListener('change',render);
document.getElementById('metric').addEventListener('change',render);
</script>
</body>
</html>
